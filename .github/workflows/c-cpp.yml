name: Firmware build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run host regression tests
        run: sh tests/run.sh
      - name: Install ARM GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi=15:13.2.rel1-2 \
            libnewlib-arm-none-eabi=4.4.0.20231231-2
      - name: Install packer dependency
        run: python -m pip install crcmod
      - name: Build optional-feature variants
        run: |
          make -B -j4 all ENABLE_FC=0
          make -B -j4 all ENABLE_TX=0
      - name: Build firmware
        run: |
          arm-none-eabi-gcc --version | head -1
          make -B -j4 all
          python3 tools/map_analyze.py obj/output.map 15
      - name: Verify artifacts
        run: |
          test -s bin/firmware
          test -s bin/firmware.bin
          test -s bin/firmware.packed.bin
          python3 -c 'from pathlib import Path; n=Path("bin/firmware.bin").stat().st_size; assert 8 <= n <= 0xF000, f"Invalid firmware size: {n}"; print(f"Raw firmware: {n}/61440 bytes ({61440-n} free)"); print("::warning::Less than 2 KiB free in firmware Flash" if 61440-n < 2048 else "Flash headroom OK")'
      - name: Upload raw and packed firmware
        uses: actions/upload-artifact@v4
        with:
          name: uvk6-reborn-firmware
          path: |
            bin/firmware
            bin/firmware.bin
            bin/firmware.packed.bin
            obj/output.map
