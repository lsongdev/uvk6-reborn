name: Firmware build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Host regressions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run host regression tests
        run: sh tests/run.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser device protocols and Pages packaging
        run: |
          npm --prefix website test
          python3 website/tests/prepare_test.py
      - name: Check UI preview generation
        run: python3 tools/ui-preview.py --frames manual-slot-rx manual-settings --output /tmp/menu-preview.png

  build:
    name: Build ${{ matrix.variant }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: uvk1
            si4732: 0
            variant: uvk1-bk1080
          - board: uvk6
            si4732: 0
            variant: uvk6-bk1080
          - board: uvk6
            si4732: 1
            variant: uvk6-si4732
    env:
      BOARD: ${{ matrix.board }}
      ENABLE_SI4732: ${{ matrix.si4732 }}
      VARIANT: ${{ matrix.variant }}
      ENABLE_TX: 1
      BUILD_TYPE: release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ARM GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@0edbb000a5a98e2292b051b463bff6f512547118 # v1
        with:
          release: '15.3.Rel1'
      - name: Install packer dependency
        run: python -m pip install crcmod
      - name: Build receive-only firmware
        run: make -B -j4 all ENABLE_TX=0
      - name: Build firmware
        run: |
          arm-none-eabi-gcc --version | head -1
          make -B -j4 all
          python3 tools/map_analyze.py "obj/$BOARD/output.map" 15
      - name: Verify and prepare artifacts
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          sys.path.insert(0, 'tools')
          from flash import validate_image

          board, variant = os.environ['BOARD'], os.environ['VARIANT']
          binary = Path('bin') / board
          raw = (binary / 'firmware.bin').read_bytes()
          validate_image(raw, board)
          budget = 0xF000 if board == 'uvk6' else 118 * 1024
          if budget - len(raw) < 2048:
              print(f'::warning::{variant}: less than 2 KiB free in application Flash')
          output = Path('dist') / variant
          output.mkdir(parents=True)
          files = {
              f'{variant}.bin': binary / 'firmware.bin',
              f'{variant}.elf': binary / 'firmware',
              f'{variant}.map': Path('obj') / board / 'output.map',
          }
          if board == 'uvk6':
              files[f'{variant}.packed.bin'] = binary / 'firmware.packed.bin'
          for name, source in files.items():
              assert source.stat().st_size > 0, f'Empty artifact: {source}'
              shutil.copyfile(source, output / name)
          metadata = {
              'board': board, 'variant': variant, 'commit': os.environ['GITHUB_SHA'],
              'toolchain': subprocess.check_output(['arm-none-eabi-gcc', '--version'], text=True).splitlines()[0],
              'flags': {'ENABLE_TX': 1,
                        'ENABLE_SI4732': int(os.environ['ENABLE_SI4732']), 'BUILD_TYPE': 'release'},
              'raw_bytes': len(raw), 'flash_budget': budget,
              'sha256': {name: hashlib.sha256((output / name).read_bytes()).hexdigest() for name in files},
          }
          (output / 'build-info.json').write_text(json.dumps(metadata, indent=2) + '\n')
          print(f'{variant}: {len(raw)}/{budget} bytes ({budget-len(raw)} free)')
          PY
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: uvk6-reborn-${{ matrix.variant }}
          path: dist/${{ matrix.variant }}/
          if-no-files-found: error

  pages:
    name: Publish website and firmware
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: uvk6-reborn-*
          path: /tmp/firmware-artifacts
      - name: Prepare static website with verified firmware
        run: python3 website/prepare.py --artifacts /tmp/firmware-artifacts --output /tmp/website --commit "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/website
      - uses: actions/deploy-pages@v4
        id: deployment
