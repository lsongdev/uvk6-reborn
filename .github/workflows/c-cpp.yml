name: Firmware build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ARM GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Install packer dependency
        run: python -m pip install crcmod
      - name: Build firmware
        run: make
      - name: Verify artifacts
        run: |
          test -s bin/firmware
          test -s bin/firmware.bin
          test -s bin/firmware.packed.bin
      - name: Upload raw and packed firmware
        uses: actions/upload-artifact@v4
        with:
          name: uvk6-reborn-firmware
          path: |
            bin/firmware
            bin/firmware.bin
            bin/firmware.packed.bin
            obj/output.map
